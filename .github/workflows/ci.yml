name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lightweight install: the tests cover the priority engine, the database and the
      # REST API, so the heavy YOLO/PyTorch stack is not needed in CI.
      - name: Install test dependencies
        run: pip install fastapi pydantic python-multipart httpx pytest pillow
      - name: Run tests
        run: pytest -q
